# Ilova paketida build_runner yo'q. Assetlar FlutterGen orqali kitda generatsiya qilinadi:
#   cd packages/qizlar_academy_kit && dart run build_runner build --delete-conflicting-outputs
# Ilova: `lib/core/assets/assets.gen.dart` → `package:qizlar_academy_kit/gen/assets.gen.dart` re-export.
targets:
  $default:
    sources:
      include:
        - $package$
        - pubspec.yaml
        - lib/**
        - test/**
        - assets/**
