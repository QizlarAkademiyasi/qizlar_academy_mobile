org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# AGP 9+: legacy pluginlar (masalan flutter_inappwebview) hali proguard-android.txt ishlatadi.
android.r8.proguardAndroidTxt.disallowed=false
# AGP 9+: eski compileSdk li Flutter pluginlar uchun vaqtinchalik bypass.
android.experimental.disableCompileSdkChecks=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Meta App Events. The client token is embedded into the final APK/AAB.
facebook.appId=1226563685979967
facebook.clientToken=fcbc01e45e69affc5e766a8af604629d

# Work around Kotlin daemon incremental cache failures when plugin sources live
# under the pub cache on C: and the Android project is built from D:.
kotlin.incremental=false
