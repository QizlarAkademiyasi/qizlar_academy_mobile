name: qizlar_academy_kit
description: "Qizlar Academy ilovasi uchun dependency wrapper paketi."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.10
  flutter_pannable_rating_bar: ^2.7.2+1
  
  # Fonts
  google_fonts: ^8.0.2

  # Routing
  go_router: ^17.1.0

  # Logging
  logger: ^2.7.0

  # Vibration
  gaimon: ^1.4.2

  # Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.1.1
  firebase_remote_config: ^6.2.0
  firebase_crashlytics: ^5.0.8
  flutter_launcher_icons: ^0.14.4

  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  get_it: ^9.2.1

  # Code generation and annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  #object equality:
  equatable: ^2.0.8

  # HTTP client
  dio: ^5.9.2
  http_parser: ^4.1.2
  dartz: ^0.10.1

  # Connectivity
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.1+2

  # Map and location
  map_launcher: ^4.4.3
  url_launcher: ^6.3.2

  # Sharing
  share_plus: ^12.0.1
  permission_handler: ^12.0.1

  # Media
  image_picker: ^1.1.2
  pdfrx: ^2.2.24

  # Device information and locale
  devicelocale: ^0.8.2

  # Local storage
  shared_preferences: ^2.5.4
  flutter_cache_manager: ^3.4.1

  # Form validation
  pinput: ^6.0.2
  sms_autofill: ^2.4.1
  pull_to_refresh: ^2.0.0

  # UI and utilities
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  octo_image: ^2.1.0
  flutter_screenutil: ^5.9.3
  flutter_html: ^3.0.0
  liquid_glass_renderer: ^0.2.0-dev.4
  # Fork: `iconBuilder` (SVG bottom nav) — pub.dev versiyasida yo'q.
  liquid_glass_widgets:
    path: ../liquid_glass_widgets
  cupertino_native: ^0.1.1
  motor: ^1.1.0
  flutter_hooks: ^0.21.3+1
  skeletonizer: ^2.1.3
  lottie_tgs: ^2.7.1
  flutter_theme_circle_animation: ^1.0.2
  flutter_story_presenter: ^1.0.7


  # Device info and utilities
  screenshot: ^3.0.0
  screen_protector: ^1.5.1
  
  # In-app review
  in_app_review: ^2.0.11
  
  # Animations
  flutter_staggered_animations: ^1.1.1
  rivership: ^0.4.0+5
  bounce: ^1.0.2

  # Notifications
  flutter_local_notifications: ^20.1.0
  
  # Toast messages
  fluttertoast: ^9.0.0
  delightful_toast: ^1.1.0

  # Video player
  story: ^1.1.0
  chewie: ^1.13.0
  omni_video_player: ^3.9.0
  google_sign_in: ^7.2.0
  adaptive_media_picker: ^0.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  test: ^1.29.0
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  build_runner: ^2.12.1
  flutter_gen_runner: ^5.13.0+1

# lottie_tgs (archive ^3) va flutter_gen (image → archive ^4) uchun bitta versiya.
dependency_overrides:
  archive: ^4.0.7

flutter_gen:
  output: lib/gen/
  line_length: 100
  integrations:
    image: true
    flutter_svg: true
    lottie: false
  assets:
    outputs:
      package_parameter_enabled: true
      class_name: UiKitAssets

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/images/
    - assets/images/bottom_sheet/
    - assets/json/
    - assets/markdown/
    - assets/lottie/
    - assets/lottie/rabbit/
    - assets/badges/
    - assets/svgs/countries/
    - assets/svgs/icons/general/
    - assets/svgs/icons/bottomNavBar/
    - assets/svgs/icons/app/
    - assets/svgs/icons/

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/images/logo.png'
  adaptive_icon_background: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background_color: "#E8649E"
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
