name: Store release

run-name: Store release · Play ${{ inputs.play_track || 'internal' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  android:
    name: Android Play (${{ inputs.play_track || 'internal' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: bash .github/scripts/read_app_version.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "ndk;28.2.13676358"

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Load Shorebird token
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            exit 0
          fi
          token_file="assets/credentials/shorebird_token.txt"
          if [ -f "$token_file" ]; then
            echo "SHOREBIRD_TOKEN=$(tr -d '\r\n' < "$token_file")" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Shorebird API key is missing."
          echo "Create one at https://console.shorebird.dev (Account, API Keys) and save it as assets/credentials/shorebird_token.txt or the SHOREBIRD_TOKEN GitHub secret."
          exit 1

      - name: Shorebird release
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          flutter-version: "3.47.5"
          args: --flavor prod --dart-define-from-file=build.json --obfuscate --split-debug-info=debug-symbols/shorebird/android --no-confirm

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: debug-symbols/shorebird/android
          retention-days: 30
          if-no-files-found: error

      - name: Write Play release notes
        run: bash .github/scripts/write_play_release_notes.sh "${{ steps.version.outputs.version }}" "${{ inputs.play_track || 'internal' }}"

      - name: Upload to Google Play
        working-directory: /tmp/play-upload
        env:
          KEY_FILE: ${{ github.workspace }}/assets/credentials/qizlar-akademiyasi-d22381d8490c.json
          PACKAGE_NAME: uz.globalmove.girls_academy
          AAB_PATH: ${{ github.workspace }}/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
          RELEASE_NAME: ${{ steps.version.outputs.version }} · ${{ inputs.play_track || 'internal' }}
          MAPPING_FILE: ${{ github.workspace }}/build/app/outputs/mapping/prodRelease/mapping.txt
          NOTES_DIR: ${{ github.workspace }}/build/whatsnew
          CHANGES_NOT_SENT_FOR_REVIEW: ${{ (inputs.play_track || 'internal') == 'production' }}
        run: |
          npm init -y >/dev/null
          npm install --silent googleapis@144
          node "$GITHUB_WORKSPACE/.github/scripts/upload_play.js"

      - name: Annotate Android result
        if: always()
        run: bash .github/scripts/annotate_store_build.sh android "${{ steps.version.outputs.version }}" "${{ inputs.play_track || 'internal' }}" "${{ job.status }}"

  ios:
    name: iOS TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: bash .github/scripts/read_app_version.sh

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Load Shorebird token
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            exit 0
          fi
          token_file="assets/credentials/shorebird_token.txt"
          if [ -f "$token_file" ]; then
            echo "SHOREBIRD_TOKEN=$(tr -d '\r\n' < "$token_file")" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Shorebird API key is missing."
          echo "Create one at https://console.shorebird.dev (Account, API Keys) and save it as assets/credentials/shorebird_token.txt or the SHOREBIRD_TOKEN GitHub secret."
          exit 1

      - name: Install iOS signing
        run: bash .github/scripts/install_ios_signing.sh

      - name: Shorebird release
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: ios
          flutter-version: "3.47.5"
          args: --export-options-plist=ios/ExportOptions.plist --dart-define-from-file=build.json --obfuscate --split-debug-info=debug-symbols/shorebird/ios --no-confirm

      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug-symbols
          path: debug-symbols/shorebird/ios
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp assets/credentials/AuthKey_9SMN52TK33.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_9SMN52TK33.p8"
          ipa="$(ls build/ios/ipa/*.ipa)"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey 9SMN52TK33 \
            --apiIssuer 2305c692-65a4-40a3-b4c4-66241279a6d4

      - name: Annotate iOS result
        if: always()
        run: bash .github/scripts/annotate_store_build.sh ios "${{ steps.version.outputs.version }}" testflight "${{ job.status }}"
