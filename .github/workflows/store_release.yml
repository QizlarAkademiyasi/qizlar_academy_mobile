name: Store release

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  android:
    name: Android Play
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "ndk;28.2.13676358"

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Load Shorebird token
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            exit 0
          fi
          token_file="assets/credentials/shorebird_token.txt"
          if [ -f "$token_file" ]; then
            echo "SHOREBIRD_TOKEN=$(tr -d '\r\n' < "$token_file")" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Shorebird API key is missing."
          echo "Create one at https://console.shorebird.dev (Account, API Keys) and save it as assets/credentials/shorebird_token.txt or the SHOREBIRD_TOKEN GitHub secret."
          exit 1

      - name: Shorebird release
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          flutter-version: "3.47.5"
          args: --flavor prod --dart-define-from-file=build.json --obfuscate --split-debug-info=debug-symbols/shorebird/android --no-confirm

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: debug-symbols/shorebird/android
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJson: assets/credentials/qizlar-akademiyasi-7daa90d6b5fb.json
          packageName: uz.globalmove.girls_academy
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          mappingFile: build/app/outputs/mapping/prodRelease/mapping.txt
          tracks: ${{ inputs.play_track }}
          status: completed
          changesNotSentForReview: ${{ inputs.play_track == 'production' }}

  ios:
    name: iOS TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Load Shorebird token
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            exit 0
          fi
          token_file="assets/credentials/shorebird_token.txt"
          if [ -f "$token_file" ]; then
            echo "SHOREBIRD_TOKEN=$(tr -d '\r\n' < "$token_file")" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Shorebird API key is missing."
          echo "Create one at https://console.shorebird.dev (Account, API Keys) and save it as assets/credentials/shorebird_token.txt or the SHOREBIRD_TOKEN GitHub secret."
          exit 1

      - name: Install iOS signing
        run: bash .github/scripts/install_ios_signing.sh

      - name: Shorebird release
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: ios
          flutter-version: "3.47.5"
          args: --export-method app-store --dart-define-from-file=build.json --obfuscate --split-debug-info=debug-symbols/shorebird/ios --no-confirm

      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug-symbols
          path: debug-symbols/shorebird/ios
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp assets/credentials/AuthKey_9SMN52TK33.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_9SMN52TK33.p8"
          ipa="$(ls build/ios/ipa/*.ipa)"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey 9SMN52TK33 \
            --apiIssuer 2305c692-65a4-40a3-b4c4-66241279a6d4
