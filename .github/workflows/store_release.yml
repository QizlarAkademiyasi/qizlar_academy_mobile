name: Store release

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  android:
    name: Android Play
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "ndk;28.2.13676358"

      - name: Build prod App Bundle
        run: |
          flutter pub get
          flutter build appbundle --release --flavor prod \
            --dart-define-from-file=build.json \
            --obfuscate \
            --split-debug-info=build/debug-info

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/debug-info
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.4
        with:
          serviceAccountJson: assets/credentials/qizlar-akademiyasi-7daa90d6b5fb.json
          packageName: uz.globalmove.girls_academy
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          mappingFile: build/app/outputs/mapping/prodRelease/mapping.txt
          tracks: ${{ inputs.play_track }}
          status: completed
          changesNotSentForReview: ${{ inputs.play_track == 'production' }}

  ios:
    name: iOS TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install iOS signing
        run: bash .github/scripts/install_ios_signing.sh

      - name: Build IPA
        run: |
          flutter pub get
          flutter build ipa --release \
            --dart-define-from-file=build.json \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug-symbols
          path: build/debug-info
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp assets/credentials/AuthKey_9SMN52TK33.p8 "$HOME/.appstoreconnect/private_keys/AuthKey_9SMN52TK33.p8"
          ipa="$(ls build/ios/ipa/*.ipa)"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey 9SMN52TK33 \
            --apiIssuer 2305c692-65a4-40a3-b4c4-66241279a6d4
